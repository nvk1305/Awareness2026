<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Cybersecurity Awareness Month 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --sync-gold: #f2bf00;
      --sync-gold-70: #f6d866;
      --sync-gold-20: #f8edc4;
      --charcoal: #474844;
      --charcoal-dark: #272825;
      --steel: #9da0a4;
      --teal: #426f89;
      --brick: #c83527;
      --dark-green: #41892c;
    }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Courier New", "Lucida Console", monospace;
      background-color: var(--charcoal-dark);
      background-image:
        linear-gradient(90deg, rgba(157, 160, 164, 0.25) 1px, transparent 1px),
        linear-gradient(rgba(157, 160, 164, 0.25) 1px, transparent 1px),
        linear-gradient(180deg, var(--charcoal-dark) 0%, var(--charcoal) 60%, var(--charcoal-dark) 100%);
      background-size: 20px 20px, 20px 20px, 100% 100%;
      background-attachment: fixed;
      color: var(--sync-gold-20);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .site-header {
      max-width: 560px;
      width: 100%;
      text-align: center;
      margin: 10px 0 24px;
    }
    .site-header h1 {
      color: var(--sync-gold);
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(39, 40, 37, 0.9);
      border: 2px solid var(--sync-gold);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 6px 6px 0 var(--charcoal-dark);
      margin: auto;
    }
    h2 {
      margin: 0 0 8px;
      color: var(--sync-gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 1.4rem;
    }
    p.sub {
      margin: 0 0 24px;
      color: var(--steel);
      font-size: 0.9rem;
    }
    #qrBox {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      margin-bottom: 16px;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
    }
    #qrBox img, #qrBox canvas { display: block; }
    #qrCode { display: inline-block; }
    #qrNumber {
      font-size: 1.3rem;
      letter-spacing: 3px;
      color: var(--sync-gold);
      margin-bottom: 4px;
      font-weight: bold;
    }
    #statusMsg {
      font-size: 0.85rem;
      color: var(--sync-gold-70);
      min-height: 1.2em;
      margin-bottom: 20px;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--charcoal-dark);
      background: var(--sync-gold);
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--charcoal-dark);
      transition: transform 120ms ease;
    }
    button:disabled {
      background: var(--steel);
      cursor: not-allowed;
      box-shadow: none;
    }
    button:not(:disabled):hover {
      transform: translateY(-2px);
    }
    #expiresAt {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--steel);
    }
    .error {
      color: var(--brick);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>India Cybersecurity Awareness Month 2026</h1>
  </header>

  <div class="card">
    <h2>Your Personal QR Code</h2>
    <p class="sub">Click the button to generate your unique 4-digit QR code. It stays valid on this device for 12 hours.</p>

    <div id="qrBox"><span id="qrCode"></span></div>
    <div id="qrNumber"></div>
    <div id="statusMsg"></div>

    <button id="generateBtn">Generate My QR Code</button>
    <div id="expiresAt"></div>
  </div>

  <script>
    // ----- Config -----
    var VALID_HOURS = 12;
    var VALID_MS = VALID_HOURS * 60 * 60 * 1000;
    var STORAGE_KEY = "syncAwarenessQrData";
    var DEVICE_KEY = "syncAwarenessDeviceId";

    // Shared cloud store (Firebase Realtime Database) so the admin page
    // can see/delete codes from every device. Each device writes only to
    // its own key (records/<deviceId>), so there's no read-modify-write
    // race condition. Security is enforced by the DB rules on the Firebase
    // side (see setup notes), not by a secret embedded here.
    var FIREBASE_DB_URL = "https://awareness2026-8b97c-default-rtdb.asia-southeast1.firebasedatabase.app";

    var qrCodeEl = document.getElementById("qrCode");
    var qrNumberEl = document.getElementById("qrNumber");
    var statusEl = document.getElementById("statusMsg");
    var btn = document.getElementById("generateBtn");
    var expiresAtEl = document.getElementById("expiresAt");
    var qrInstance = null;
    var countdownTimer = null;

    function getDeviceId() {
      var id = localStorage.getItem(DEVICE_KEY);
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    }

    function formatNumber(n) {
      return String(n).padStart(4, "0");
    }

    function renderQr(number) {
      qrCodeEl.innerHTML = "";
      qrInstance = new QRCode(qrCodeEl, {
        text: String(number),
        width: 200,
        height: 200,
        colorDark: "#272825",
        colorLight: "#ffffff"
      });
      qrNumberEl.textContent = formatNumber(number);
    }

    function saveLocalRecord(number, issuedAt) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ number: number, issuedAt: issuedAt }));
    }

    function loadLocalRecord() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function msRemaining(record) {
      return record.issuedAt + VALID_MS - Date.now();
    }

    async function fetchAllRecords() {
      var res = await fetch(FIREBASE_DB_URL + "/records.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Unable to reach shared store");
      var data = await res.json();
      if (!data) return [];
      return Object.keys(data).map(function (deviceId) {
        return { deviceId: deviceId, number: data[deviceId].number, issuedAt: data[deviceId].issuedAt };
      });
    }

    // Writes only this device's own node - no read-modify-write, so
    // concurrent generations from other devices can't clobber each other.
    async function saveRecord(deviceId, record) {
      var res = await fetch(FIREBASE_DB_URL + "/records/" + deviceId + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number: record.number, issuedAt: record.issuedAt })
      });
      if (!res.ok) throw new Error("Unable to save to shared store");
    }

    function startCountdown(record) {
      if (countdownTimer) clearInterval(countdownTimer);
      function tick() {
        var remaining = msRemaining(record);
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          lockToState({ active: false });
          return;
        }
        var h = Math.floor(remaining / 3600000);
        var m = Math.floor((remaining % 3600000) / 60000);
        var s = Math.floor((remaining % 60000) / 1000);
        expiresAtEl.textContent =
          "Valid for " + h + "h " + m + "m " + s + "s on this device";
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    function lockToState(opts) {
      if (opts.active) {
        btn.disabled = true;
        statusEl.textContent = "This QR code is already active on your device.";
        statusEl.classList.remove("error");
      } else {
        btn.disabled = false;
        statusEl.textContent = "Generate a new code.";
        expiresAtEl.textContent = "";
        qrCodeEl.innerHTML = "";
        qrNumberEl.textContent = "";
      }
    }

    // Checks the shared store to see if this device's code is still
    // present (an admin delete removes it here, unlocking generation
    // early even if the 12h window hasn't elapsed).
    async function findRemoteRecordForDevice(deviceId) {
      var all = await fetchAllRecords();
      var now = Date.now();
      var active = all.filter(function (r) { return r.issuedAt + VALID_MS > now; });
      return active.find(function (r) { return r.deviceId === deviceId; }) || null;
    }

    function randomFourDigit() {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % 10000;
    }

    function generateUniqueNumber(activeNumbers) {
      var used = new Set(activeNumbers.map(function (r) { return r.number; }));
      // Only 10,000 possible 4-digit codes; retry until a free one is found.
      for (var i = 0; i < 200; i++) {
        var candidate = randomFourDigit();
        if (!used.has(candidate)) return candidate;
      }
      throw new Error("No available codes left");
    }

    async function handleGenerate() {
      var deviceId = getDeviceId();

      btn.disabled = true;
      statusEl.textContent = "Checking your device status...";
      statusEl.classList.remove("error");

      try {
        var all = await fetchAllRecords();
        var now = Date.now();
        var active = all.filter(function (r) { return r.issuedAt + VALID_MS > now; });
        var mine = active.find(function (r) { return r.deviceId === deviceId; });

        if (mine) {
          saveLocalRecord(mine.number, mine.issuedAt);
          renderQr(mine.number);
          startCountdown(mine);
          lockToState({ active: true });
          return;
        }

        // Not active remotely (never generated, expired, or admin-deleted).
        statusEl.textContent = "Generating your unique code...";
        var number = generateUniqueNumber(active);
        var issuedAt = now;
        var record = { number: number, issuedAt: issuedAt, deviceId: deviceId };

        await saveRecord(deviceId, record);

        saveLocalRecord(number, issuedAt);
        renderQr(number);
        startCountdown(record);
        lockToState({ active: true });
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Could not generate a code. Please try again.";
        statusEl.classList.add("error");
        btn.disabled = false;
      }
    }

    async function init() {
      var deviceId = getDeviceId();
      var local = loadLocalRecord();
      if (local && msRemaining(local) > 0) {
        // Optimistically show the locally cached code, then confirm
        // against the shared store in case an admin deleted it.
        renderQr(local.number);
        startCountdown(local);
        lockToState({ active: true });
      }
      try {
        var remote = await findRemoteRecordForDevice(deviceId);
        if (!remote) {
          if (countdownTimer) clearInterval(countdownTimer);
          lockToState({ active: false });
        }
      } catch (err) {
        console.warn("Could not verify remote status:", err);
      }
    }

    btn.addEventListener("click", handleGenerate);
    init();
  </script>
</body>
</html>
